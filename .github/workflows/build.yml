      - name: Unzip and build
        run: |
          unzip -q *.zip -d project
          cd "$(dirname "$(find project -name 'build.gradle*' | head -n1)")"
          sed -i 's/1\.6-SNAPSHOT/1.6.12/' build.gradle
          if ! grep -q pluginManagement settings.gradle 2>/dev/null; then
            {
              echo 'pluginManagement {'
              echo '    repositories {'
              echo '        maven { url = "https://maven.fabricmc.net/" }'
              echo '        mavenCentral()'
              echo '        gradlePluginPortal()'
              echo '    }'
              echo '}'
              [ -f settings.gradle ] && cat settings.gradle
            } > settings.new
            mv settings.new settings.gradle
          fi
          gradle build --no-daemon
          echo "DIR=$PWD" >> $GITHUB_ENV

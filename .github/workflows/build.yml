name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Unzip and build
        run: |
          unzip -q *.zip -d project
          cd "$(dirname "$(find project -name 'build.gradle*' | head -n1)")"
          sed -i 's/1\.6-SNAPSHOT/1.6.12/' build.gradle
          {
            echo 'pluginManagement {'
            echo '    repositories {'
            echo '        maven { url = "https://maven.fabricmc.net/" }'
            echo '        mavenCentral()'
            echo '        gradlePluginPortal()'
            echo '    }'
            echo '}'
            [ -f settings.gradle ] && cat settings.gradle
          } > settings.new
          mv settings.new settings.gradle
          gradle build --no-daemon
          echo "DIR=$PWD" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ env.DIR }}/build/libs/*.jar
